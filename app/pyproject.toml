[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unweave"
version = "1.5.8"
description = "Standalone desktop app for Sound Razor - AI audio stem separation with enhanced UI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "um1chc5"},
]
keywords = ["audio", "separation", "stems", "demucs", "music", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "pywebview>=5.0",
]

[project.optional-dependencies]
# These used to point at a nonexistent external "unweave[...]" package (a packaging bug),
# so `.[separation]` could never actually be installed. Declared directly here instead.
separation = [
    "audio-separator>=0.24",
    "onnxruntime>=1.17",
    "torch>=2.1",
    "audioread>=3.0",
]
guitars = [
    "torch>=2.1",
    "beartype>=0.18",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    "audioread>=3.0",
]
chords = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    "beat-this>=1.0",
    "autochord>=0.1.4",
    "faster-whisper>=1.0",
]
youtube = [
    # YouTube breaks old extractors often; keep a recent floor so first-run
    # install / repair does not leave a 2024-era yt-dlp that exits 1.
    "yt-dlp>=2025.10.14",
]
full = [
    "unweave[separation,guitars,youtube,chords]",
]

[project.scripts]
unweave = "app.ui_entrypoint:main"

[tool.setuptools.packages.find]
where = ["app"]
include = ["unweave*", "app*"]

[tool.setuptools.package-data]
"unweave" = ["web/*", "web/**/*", "vendor/**/*"]
